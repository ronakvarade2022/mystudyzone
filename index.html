    <script>
      // Gracefully handle Vite WebSocket / HMR disconnects in preview environments
      window.addEventListener('unhandledrejection', function(event) {
        if (event && event.reason) {
          var msg = (event.reason.message || String(event.reason) || '');
          if (msg.includes('WebSocket') || msg.includes('vite-hmr') || msg.includes('failed to connect to websocket')) {
            event.preventDefault();
            console.debug('[Vite HMR Guard] Handled gracefully:', msg);
          }
        }
      });
    </script>
